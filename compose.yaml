services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mygarage}
      POSTGRES_USER: ${POSTGRES_USER:-mygarage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mygarage_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mygarage} -d ${POSTGRES_DB:-mygarage}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
